name: CI Test & Quality Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libimage-exiftool-perl             foremost             steghide             ffmpeg             qpdf

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Compilation Smoke Test
        run: |
          python3 -m py_compile server.py app.py test_suite.py

      - name: Verify 70 Registered Tools
        run: |
          python3 -c "from server import mcp; tools = mcp._tool_manager.list_tools(); print(f'Loaded {len(tools)} tools'); assert len(tools) >= 70, f'Expected 70 tools, found {len(tools)}'"

      - name: Run Master 29-Test Automated Verification Harness
        run: |
          python3 test_suite.py
