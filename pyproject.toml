[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stegokiller"
version = "4.5.0"
description = "StegoKiller Ultra MCP Suite by Knight_S - Comprehensive Steganography, Forensics, Covert-Channel & Autonomous Solving Server (70 Specialized Tools)"
readme = "README.md"
authors = [
    { name = "Knight_S" }
]
license = { text = "Apache-2.0" }
keywords = ["mcp", "steganography", "forensics", "ctf", "cybersecurity", "fastmcp", "audio-stego", "image-stego"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Security :: Cryptography"
]
dependencies = [
    "mcp>=1.3.0,<2.0.0",
    "fastmcp>=0.1.0",
    "starlette>=0.36.0",
    "uvicorn>=0.28.0",
    "gradio>=4.20.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "scapy>=2.5.0",
    "stegpy>=0.1.0",
    "pysstv>=0.1.2",
    "bitstring>=4.1.0",
    "cryptography>=41.0.0"
]

[project.scripts]
stegokiller = "cli:main"

[project.urls]
Homepage = "https://github.com/shaymimran26-netizen/StegoKiller"
Documentation = "https://shaymimran26-netizen.github.io/StegoKiller/"
Repository = "https://github.com/shaymimran26-netizen/StegoKiller.git"
"Bug Tracker" = "https://github.com/shaymimran26-netizen/StegoKiller/issues"

[tool.setuptools]
py-modules = ["server", "app", "cli", "test_suite"]
