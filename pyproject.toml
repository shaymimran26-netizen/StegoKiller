[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stegokiller"
version = "4.0.0"
description = "StegoKiller Ultra MCP Suite by Knight_S - Comprehensive Steganography, Forensics & Covert-Channel Server"
readme = "README.md"
authors = [
    { name = "Knight_S" }
]
license = { text = "Apache-2.0" }
keywords = ["mcp", "steganography", "forensics", "ctf", "cybersecurity", "fastmcp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.3.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "scapy>=2.5.0",
    "stegpy>=0.1.0",
    "pysstv>=0.1.2",
    "bitstring>=4.1.0",
    "cryptography>=41.0.0"
]

[project.scripts]
stegokiller = "server:mcp.run"

[project.urls]
Homepage = "https://github.com/shaymimran26-netizen/StegoKiller"
Documentation = "https://shaymimran26-netizen.github.io/StegoKiller/"
Repository = "https://github.com/shaymimran26-netizen/StegoKiller.git"
"Bug Tracker" = "https://github.com/shaymimran26-netizen/StegoKiller/issues"
